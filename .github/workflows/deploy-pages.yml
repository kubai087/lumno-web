name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Best-effort fallback; offset from the busy start of each hour.
    # Extension releases also dispatch this workflow directly, and the extension
    # repo's watch-store-publication workflow dispatches it again as soon as
    # each store serves the new version.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history lets sitemap.xml read each page's real last-modified commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check site
        run: npm run check

      - name: Resolve extension store versions
        env:
          CHROME_EXTENSION_ID: nggfkkbmogmadfoikakkfegkoilfcfao
          EDGE_EXTENSION_ID: pfbklkaefmfamjpibfiapaiihlddhchc
          FIREFOX_ADDON_ID: lumno@kubai087
        run: |
          set -u
          CHROME_VERSION="$(node scripts/get-chrome-store-version.mjs || true)"
          EDGE_VERSION="$(node scripts/get-edge-store-version.mjs || true)"
          FIREFOX_VERSION="$(node scripts/get-firefox-store-version.mjs || true)"
          if [ -n "$CHROME_VERSION" ]; then
            echo "PUBLIC_CHROME_STORE_VERSION=$CHROME_VERSION" >> "$GITHUB_ENV"
            echo "Resolved Chrome Web Store version: $CHROME_VERSION"
          else
            echo "Could not resolve Chrome Web Store version. The release page will retry the store lookup and omit unavailable status."
          fi
          if [ -n "$EDGE_VERSION" ]; then
            echo "PUBLIC_EDGE_STORE_VERSION=$EDGE_VERSION" >> "$GITHUB_ENV"
            echo "Resolved Microsoft Edge Add-ons version: $EDGE_VERSION"
          else
            echo "Could not resolve Microsoft Edge Add-ons version. Hide its version tag."
          fi
          if [ -n "$FIREFOX_VERSION" ]; then
            echo "PUBLIC_FIREFOX_STORE_VERSION=$FIREFOX_VERSION" >> "$GITHUB_ENV"
            echo "Resolved Firefox Add-ons version: $FIREFOX_VERSION"
          else
            echo "Firefox Add-ons has no public version yet. Leave Firefox off the site."
          fi

      - name: Validate OAuth protection configuration
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "${PUBLIC_RECAPTCHA_SITE_KEY:-}" ]; then
            echo "::error::PUBLIC_RECAPTCHA_SITE_KEY is required before deploying the account OAuth flow."
            exit 1
          fi

      - name: Build site
        env:
          GITHUB_RELEASES_OWNER: kubai087
          GITHUB_RELEASES_REPO: lumno-extension
          GITHUB_RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_BAIDU_SITE_VERIFICATION: ${{ secrets.PUBLIC_BAIDU_SITE_VERIFICATION }}
          PUBLIC_SOGOU_SITE_VERIFICATION: ${{ secrets.PUBLIC_SOGOU_SITE_VERIFICATION }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
