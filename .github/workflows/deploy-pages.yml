name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Chrome Web Store version
        env:
          CHROME_EXTENSION_ID: nggfkkbmogmadfoikakkfegkoilfcfao
        run: |
          set -u
          VERSION="$(node scripts/get-chrome-store-version.mjs || true)"
          if [ -n "$VERSION" ]; then
            echo "PUBLIC_CHROME_STORE_VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Resolved Chrome Web Store version: $VERSION"
          else
            echo "Could not resolve Chrome Web Store version. Keep fallback review status."
          fi

      - name: Build site
        env:
          GITHUB_RELEASES_OWNER: kubai087
          GITHUB_RELEASES_REPO: lumno-extension
          GITHUB_RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_BAIDU_SITE_VERIFICATION: ${{ secrets.PUBLIC_BAIDU_SITE_VERIFICATION }}
          PUBLIC_SOGOU_SITE_VERIFICATION: ${{ secrets.PUBLIC_SOGOU_SITE_VERIFICATION }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
