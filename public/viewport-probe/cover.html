<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Viewport probe (cover)</title>
<style>
  html, body { margin: 0; background: #fff; color: #111; font: 12px/1.45 ui-monospace, Menlo, monospace; }
  body { min-height: 300vh; }
  .ruler { position: absolute; left: 0; top: 0; width: 100%; height: 300vh; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 10px); }
  .tick { position: absolute; left: 0; width: 46px; border-top: 2px solid #06f; color: #06f; font-weight: 700; padding-left: 2px; }
  .fixed-top { position: fixed; top: 0; left: 50px; right: 0; height: 22px; background: rgba(230,0,0,.75); color: #fff; padding: 2px 6px; z-index: 9; }
  .fixed-bottom { position: fixed; bottom: 0; left: 50px; right: 0; height: 22px; background: rgba(0,150,60,.8); color: #fff; padding: 2px 6px; z-index: 9; }
  .env { position: fixed; visibility: hidden; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .pill { position: fixed; top: 6px; left: 60px; right: 10px; height: 58px; border-radius: 29px; z-index: 8;
    background: rgba(255,255,255,.84); border: 1px solid #d3d9e2; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    display: none; align-items: center; padding: 0 16px; font-weight: 700; }
  body.pill-on .pill { display: flex; }
  .marker { position: absolute; top: 600px; left: 54px; right: 8px; border-top: 3px solid #f0a; color: #f0a; font-weight: 700; }
  main { position: relative; margin: 140px 8px 0 54px; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  pre { white-space: pre-wrap; word-break: break-all; margin: 0 0 10px; background: #f3f4f6; padding: 6px; border-radius: 6px; }
</style>
</head>
<body>
<div class="ruler" id="ruler"></div>
<div class="fixed-top">fixed top:0</div>
<div class="fixed-bottom">fixed bottom:0</div>
<div class="env" id="env"></div>
<div class="pill">pill (fixed top:6px) · 页面 y&gt;400 时出现</div>
<div class="marker" id="marker">页面 y=600 标记</div>
<main>
  <h1>cover · 蓝色刻度 = 页面 y 坐标</h1>
  <pre id="now"></pre>
  <pre id="log"></pre>
  <pre id="ua"></pre>
</main>
<script>
  const t0 = performance.now();
  const ruler = document.getElementById("ruler");
  for (let y = 0; y <= 600; y += 50) {
    const tick = document.createElement("div");
    tick.className = "tick"; tick.style.top = y + "px"; tick.textContent = y;
    ruler.append(tick);
  }
  const env = document.getElementById("env");
  const read = () => {
    const cs = getComputedStyle(env);
    const vv = window.visualViewport;
    const r = (n) => Math.round(n * 10) / 10;
    return {
      inner: innerWidth + "x" + innerHeight,
      client: document.documentElement.clientWidth + "x" + document.documentElement.clientHeight,
      vv: vv ? r(vv.width) + "x" + r(vv.height) + " off " + r(vv.offsetTop) + " page " + r(vv.pageTop) : "-",
      scrollY: r(scrollY),
      env: [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].map(parseFloat).join("/"),
      screen: screen.width + "x" + screen.height,
    };
  };
  const lines = [];
  const log = (text) => {
    lines.push("+" + Math.round(performance.now() - t0) + "ms " + text);
    if (lines.length > 40) lines.splice(1, 1);
    document.getElementById("log").textContent = "changes (since script start, nav→script " + Math.round(t0) + "ms)\n" + lines.join("\n");
  };
  let last = "";
  const sample = (why) => {
    const v = read();
    const key = JSON.stringify({ ...v, scrollY: 0, vv: v.vv.replace(/ page .*/, "") });
    document.getElementById("now").textContent = "now  " + Object.entries(v).map(([k, x]) => k + "=" + x).join("\n     ");
    if (key === last) return;
    last = key;
    log(why + "  inner " + v.inner + "  vv " + v.vv + "  scroll " + v.scrollY + "  env " + v.env);
  };
  sample("start");
  // Every frame: viewport changes, the pill toggling like the site's bar, and any
  // sudden move of the page that scrolling alone would not explain.
  const marker = document.getElementById("marker");
  let lastScroll = scrollY;
  let lastMarker = marker.getBoundingClientRect().top + scrollY;
  const frame = () => {
    sample("frame");
    const on = scrollY > 400;
    if (on !== document.body.classList.contains("pill-on")) {
      document.body.classList.toggle("pill-on", on);
      log("pill " + (on ? "ON" : "OFF") + " at scroll " + Math.round(scrollY));
    }
    const docMarker = marker.getBoundingClientRect().top + scrollY;
    if (Math.abs(docMarker - lastMarker) > 0.5) log("page shifted: marker doc y " + Math.round(lastMarker) + " → " + Math.round(docMarker));
    if (Math.abs(scrollY - lastScroll) > 60) log("scroll jump " + Math.round(lastScroll) + " → " + Math.round(scrollY));
    lastMarker = docMarker;
    lastScroll = scrollY;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  for (const type of ["resize", "scroll", "load", "pageshow", "orientationchange"]) addEventListener(type, () => sample(type), { passive: true });
  window.visualViewport && visualViewport.addEventListener("resize", () => sample("vv-resize"));
  setInterval(() => sample("tick"), 500);
  document.getElementById("ua").textContent = navigator.userAgent;
</script>
</body>
</html>
